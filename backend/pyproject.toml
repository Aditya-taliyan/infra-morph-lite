[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-morph-backend"
version = "0.1.0"
description = "Backend service for Infra Morph Lite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8"
]

[project.scripts]
infra-morph = "app.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.coverage.run]
source = [
    "app.cli",
    "app.core",
    "app.generators",
    "app.models",
    "app.services",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
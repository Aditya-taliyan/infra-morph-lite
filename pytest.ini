# Single pytest config for the repo. Works from the repo root and from backend/
# (pytest searches upward from the current directory and finds this file).
[pytest]
testpaths = backend/tests
# Plain "pytest -q" skips tests that run the real terraform binary;
# run them with "pytest -m integration".
addopts = -m "not integration"
markers =
    integration: runs the real terraform binary (slow; first run downloads the AWS provider)

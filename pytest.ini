# Single pytest config for the repo. Works from the repo root and from backend/
# (pytest searches upward from the current directory and finds this file).
[pytest]
testpaths = backend/tests frontend/tests
# Plain "pytest -q" skips tests that need real external tools (terraform, Ollama);
# run them with "pytest -m integration".
addopts = -m "not integration"
markers =
    integration: runs real external tools: terraform (first run downloads the AWS provider) or a local Ollama
